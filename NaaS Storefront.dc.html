<style>
@font-face{font-family:'Aleck';src:url('fonts/ATTAleckSans_Regular.woff2') format('woff2'),url('fonts/AleckSans-Rg.ttf');font-weight:400}
@font-face{font-family:'Aleck';src:url('fonts/ATTAleckSans_Medium.woff2') format('woff2'),url('fonts/AleckSans-Md.ttf');font-weight:500}
@font-face{font-family:'Aleck';src:url('fonts/ATTAleckSans_Bold.woff2') format('woff2'),url('fonts/AleckSans-Bd.ttf');font-weight:700}
body{margin:0;font-family:'Aleck','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-0.03em}
button,input,select,textarea{font-family:inherit;letter-spacing:inherit}
a{color:#0057b8}a:hover{color:#00388f}
[data-theme="light"]{--bg-base:#ffffff;--bg-wash:#f8fafb;--bg-neutral:#eef2f5;--bg-accent:#e6f0fa;--text-heading:#13171b;--text-body:#454b52;--text-light:#686e74;--text-disabled:#8a949c;--link:#0057b8;--border-primary:#c2cbd2;--border-secondary:#dfe5ea;--border-active:#0057b8;--cta:#0057b8;--cta-hover:#00388f;--success:#1f7a3d;--warning:#b85f00;--error:#c23131;--band:#e6f0fa;--band-stroke:#99daf5}
[data-theme="dark"]{--bg-base:#1a2431;--bg-wash:#111821;--bg-neutral:#222e3c;--bg-accent:#16324e;--text-heading:#f2f6fa;--text-body:#c5cfd9;--text-light:#97a3b0;--text-disabled:#67737f;--link:#66c8f0;--border-primary:#4e5e6f;--border-secondary:#2f3d4d;--border-active:#66c8f0;--cta:#0057b8;--cta-hover:#0064d6;--success:#6ecf63;--warning:#ffa25e;--error:#ff7a8f;--band:#16324e;--band-stroke:#3374cc}
.fx-filters{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.fx-filter{display:inline-flex;align-items:center;gap:8px;position:relative}
.fx-label{font-size:14px;line-height:20px;font-weight:500;color:var(--text-heading);white-space:nowrap}
.fx-select{box-sizing:border-box;appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;gap:8px;height:36px;min-width:102px;padding:8px 36px 8px 12px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%231d2329' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>") no-repeat right 12px center;box-shadow:0 1px 1px rgba(0,0,0,.1);color:var(--text-heading);font:inherit;font-size:14px;line-height:20px;font-weight:400;text-align:left;cursor:pointer;white-space:nowrap}
.fx-select:hover{border-color:var(--border-primary)}.fx-select:focus{outline:2px solid var(--border-active);outline-offset:1px}
[data-theme="dark"] .fx-select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none' stroke='%23f2f6fa' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>")}
.fx-count{min-width:18px;height:18px;padding:0 5px;border-radius:9999px;background:var(--cta);color:#fff;font-size:11px;line-height:18px;font-weight:700;text-align:center}
.fx-search{box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:36px;width:272px;max-width:100%;padding:0 12px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);box-shadow:0 1px 1px rgba(0,0,0,.1)}
.fx-search input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--text-heading);min-width:0;flex:1;outline:none}
.fx-btn{box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);box-shadow:0 1px 1px rgba(0,0,0,.1);color:var(--text-heading);font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
/* Figma AI Fabric UI cards (table-horizontal-bar-chart 114:1719, Alert 114:2625, Badge). */
.fx-card{padding:24px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;display:grid;gap:16px;min-width:0;align-content:start}
.fx-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.fx-card-head>div{min-width:0;flex:1 1 auto}
.fx-card-head>.fx-btn{flex:none}
.fx-card-title{margin:0;font-size:16px;line-height:24px;font-weight:500;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-card-sub{font-size:12px;line-height:16px;color:var(--text-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-rows{display:grid}
.fx-row{display:grid;grid-template-columns:minmax(150px,40%) minmax(0,1fr) 84px;align-items:center;min-height:40px;border-bottom:1px solid var(--border-secondary)}
.fx-row>*{padding:0 8px;min-width:0}
.fx-row .lbl{display:grid;gap:1px;padding:6px 8px}
.fx-row .lbl b{font-size:14px;line-height:18px;letter-spacing:-.4px;font-weight:500;color:var(--text-heading);text-wrap:balance}
.fx-row .lbl small{font-size:11px;line-height:14px;color:var(--text-light)}
.fx-row .bar{display:flex;align-items:center;gap:1px;height:16px}
.fx-row .bar span{display:block;height:16px;border-radius:2px;min-width:0}
.fx-row .val{text-align:right;font-size:14px;line-height:20px;letter-spacing:-.4px;color:var(--text-heading);white-space:nowrap}
.fx-row .val small{display:block;font-size:11px;line-height:14px;color:var(--text-light);font-weight:400}
main button[style*="border-radius:9999px"],main button[style*="border-radius: 9999px"]{border-radius:8px!important}
.dt{display:table;width:100%;border-collapse:collapse}.dt-h{display:table-header-group}.dt-b{display:table-row-group}.dt-r{display:table-row}.dt-c{display:table-cell;vertical-align:middle}.dt-th{font-weight:500}
.sk{background:var(--bg-neutral);border-radius:8px;animation:skPulse 1.4s ease-in-out infinite}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes skSpin{to{transform:rotate(360deg)}}
.fx-kpi{padding:16px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;display:grid;gap:10px;text-align:left;cursor:pointer;color:var(--text-heading);font:inherit;min-width:0}
.fx-kpi:hover{border-color:var(--border-active)}
.fx-kpi .lab{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.4px}
.fx-kpi .lab .fx-badge{height:22px;flex:none}
.fx-kpi .val{font-size:32px;line-height:36px;font-weight:700;letter-spacing:-.96px;white-space:nowrap}
.fx-kpi .val small{font-size:14px;font-weight:500;letter-spacing:-.4px;color:var(--text-body);margin-left:4px}
.fx-kpi .sub{font-size:13px;line-height:18px;letter-spacing:-.4px;color:var(--text-light)}
.fx-kpi.sm{padding:14px 16px;gap:6px}
.fx-kpi.sm .lab{display:block;font-size:12px;line-height:16px;letter-spacing:-.2px;font-weight:500;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-kpi.sm .val{font-size:26px;line-height:32px;letter-spacing:-.78px}
.fx-kpi.sm .val small{font-size:12px;margin-left:3px}
.fx-kpi.sm .sub{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;font-size:11px;line-height:14px;letter-spacing:-.2px}
.fx-kpi.sm .sub .fx-badge{height:20px;font-size:11px;padding:0 6px;gap:3px;flex:none}
.fx-card.sm{padding:20px;gap:12px}
.fx-card.sm .fx-row{grid-template-columns:minmax(0,48%) minmax(0,1fr) 72px;min-height:36px}
.fx-card.sm .fx-row .lbl{padding:4px 6px 4px 0}
.fx-card.sm .fx-row .lbl b{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fx-card.sm .fx-row .lbl small{font-size:10px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fx-card.sm .fx-row .val{font-size:12px;padding-right:0}
.fx-card.sm .fx-row .val small,.fx-card.sm .fx-row .val .door-l{font-size:10px;line-height:12px}
.fx-card.sm .fx-row .bar span{height:12px}
.fx-card.sm .fx-card-title{font-size:14px;line-height:20px}
.fx-cols{display:flex;align-items:flex-end;gap:3px;height:88px}
.fx-cols>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:1px;min-width:0}
.fx-cols>div span{display:block;width:100%;border-radius:2px}
.fx-row.door{cursor:pointer;border-radius:8px}
.fx-row.door:hover{background:var(--bg-wash)}
.fx-row .val .door-l{display:block;font-size:11px;line-height:14px;font-weight:500}
.fx-row.total{border-bottom:0;min-height:36px}
.fx-row.total .lbl b,.fx-row.total .val{font-weight:700}
.fx-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;line-height:16px;color:var(--text-light)}
.fx-legend span{display:inline-flex;align-items:center;gap:8px}
.fx-legend i{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.fx-badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--border-secondary);border-radius:9999px;background:var(--bg-base);font-size:11px;line-height:16px;font-weight:500;color:var(--text-body);white-space:nowrap;vertical-align:middle}
.fx-badge.att{border-color:#009fdb;color:#0074b3;background:rgba(0,159,219,.08)}
.fx-badge.new{border-color:#91dc00;color:#3d6b00;background:rgba(145,220,0,.14)}
[data-theme="dark"] .fx-badge.att{color:#5ec8f0}[data-theme="dark"] .fx-badge.new{color:#b6ec4c}
.fx-alert{display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:12px}
.fx-alert-body{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:20px;letter-spacing:-.4px}
.fx-alert-icon{width:16px;height:16px;margin-top:2px;flex:none;background:url('brand/lights-on.svg') center / contain no-repeat}
[data-theme="dark"] .fx-alert-icon{filter:invert(1)}
.fx-alert-title{font-weight:500;color:var(--text-heading)}
.fx-alert-text{color:var(--text-light);text-wrap:pretty}
.fx-paths{margin:0 12px 12px 12px;padding:12px 14px 14px;background:var(--bg-wash);border:1px solid var(--border-secondary);border-radius:12px;display:grid;gap:6px;animation:fadeIn .2s}
.fx-paths-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:0 2px 4px}
.fx-paths-head b{font-size:13px;line-height:18px;font-weight:500;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-paths-head small{font-size:11px;line-height:14px;color:var(--text-light);white-space:nowrap}
.fx-path{background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:10px;overflow:hidden}
.fx-path-row{display:grid;grid-template-columns:8px minmax(120px,24%) minmax(0,1fr) 84px;gap:12px;align-items:center;width:100%;padding:8px 12px;border:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:var(--text-heading)}
.fx-path-row:hover{background:var(--bg-wash)}
.fx-path-row .dot,.fx-hop .dot{width:8px;height:8px;border-radius:9999px;flex:none}
.fx-path-row .who{display:grid;gap:1px;min-width:0}.fx-path-row .who b{font-size:13px;line-height:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fx-path-row .who small{font-size:11px;line-height:14px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-path-row .trail{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;white-space:nowrap}
.hop{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;border:1px solid var(--border-secondary);background:var(--bg-base);font-size:11px;line-height:18px;font-weight:500;color:var(--text-body);white-space:nowrap;flex:none}
.hop.warn{border-color:var(--warning);color:var(--warning);background:rgba(184,95,0,.08)}
.hop.bad{border-color:var(--error);color:var(--error);background:rgba(194,49,49,.08)}
.trail .sep{color:var(--text-disabled);font-size:11px;flex:none}
.fx-path-row .num{text-align:right;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.fx-path-row .num small{display:block;font-size:11px;line-height:14px;font-weight:400;color:var(--text-light)}
.fx-trace{border-top:1px solid var(--border-secondary);padding:8px 12px 10px 32px;display:grid;gap:2px;animation:fadeIn .2s;background:var(--bg-wash)}
.fx-hop{display:grid;grid-template-columns:8px minmax(0,1fr) 56px 168px;gap:12px;align-items:center;min-height:30px;font-size:12px;line-height:16px}
.fx-hop>span:last-child{justify-self:end}
.fx-hop .n{display:grid;min-width:0}.fx-hop .n b{color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fx-hop .n small{font-size:11px;line-height:14px;color:var(--text-light)}
.fx-hop .ms{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-body)}
.fx-hop .fx-btn{height:24px;padding:0 8px;font-size:11px}
.fx-trace-foot{display:flex;gap:8px;padding-top:6px;align-items:center;font-size:11px;color:var(--text-light)}
@media (max-height:719px){aside[aria-label$="sections"]{position:static!important;height:auto!important}aside[aria-label$="sections"]>div{overflow:visible!important}}
.fx-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fx-chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:9999px;border:1px solid var(--border-secondary);background:var(--bg-wash);color:var(--text-body);font-size:11px;line-height:18px;font-weight:500;white-space:nowrap}
.fx-chip.auto{background:transparent;border-style:dashed;color:var(--text-light)}
.fx-chip.user{background:var(--bg-accent);border-color:transparent;color:var(--link);padding-right:2px}
.fx-chip.add{background:transparent;border-style:dashed;color:var(--link);cursor:pointer}
.fx-chip.add:hover{background:var(--bg-accent);border-color:var(--link)}
.fx-chip-x{width:16px;height:16px;border:0;border-radius:9999px;background:transparent;color:inherit;font-size:13px;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.fx-chip-x:hover{background:rgba(0,0,0,.08)}
.fx-label-input{height:24px;padding:0 8px;border:1px solid var(--border-active);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:12px;min-width:150px;outline:none}
.fx-btn:hover{border-color:var(--border-active)}
.fx-spacer{margin-left:auto}
@keyframes bandBreathe{0%{opacity:.7}50%{opacity:1}100%{opacity:.92}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes crawl{to{stroke-dashoffset:-24}}
@keyframes pulseOnce{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg-wash);color:var(--text-body);font-size:14px;line-height:20px">


<header style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:32px;height:64px;padding:0 24px;background:var(--bg-base);border-bottom:1px solid var(--border-secondary)">
  <div style="position:relative">
    <!-- Stacked wordmark, as drawn on the AI Fabric UI main-header. The click still opens the layer elevator. -->
    <button onClick="{{ toggleElevator }}" aria-haspopup="menu" aria-expanded="{{ elevatorOpen }}" aria-label="AT&amp;T AI-grade network, layers" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:4px 8px;margin:0 -8px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;white-space:nowrap;line-height:1" style-focus="outline:2px solid var(--border-active);outline-offset:1px"><span style="font-size:10px;line-height:12px;font-weight:700;letter-spacing:.02em;color:#009fdb">AT&amp;T</span><span style="display:flex;align-items:center;gap:6px;font-size:22px;line-height:24px;letter-spacing:-.03em;color:var(--text-heading)"><span><span style="font-weight:500">AI-grade </span><span style="font-weight:700">network</span></span><span aria-hidden="true" style="display:inline-block;font-size:12px;color:var(--text-light);font-weight:400;transform:{{ chevronRot }};transition:transform .15s">⌄</span></span></button>
    <sc-if value="{{ elevatorOpen }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeElevator }}" style="position:fixed;inset:0;z-index:25"></div>
      <div role="menu" aria-label="Switch network layer" style="position:absolute;z-index:26;top:calc(100% + 8px);left:0;width:320px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);overflow:hidden;animation:fadeIn .15s">
        <div style="padding:12px 16px;font-size:12px;line-height:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-light);border-bottom:1px solid var(--border-secondary)">AT&amp;T AI-grade network · layers</div>
        <sc-for list="{{ elevator }}" as="l" hint-placeholder-count="4">
          <a role="menuitem" href="{{ l.href }}" onClick="{{ l.go }}" aria-current="{{ l.cur }}" style="display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;height:48px;padding:0 16px;background:{{ l.bg }};opacity:{{ l.op }};cursor:{{ l.cursor }};text-decoration:none;color:inherit" style-hover="background:{{ l.hover }}"><sc-if value="{{ l.cur }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color:var(--link);font-weight:700;font-size:14px;text-align:center">✓</span></sc-if><sc-if value="{{ l.notCur }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width:18px;height:18px;background:url('{{ l.icon }}') center / contain no-repeat"></span></sc-if><span><span style="display:block;font-size:14px;line-height:18px;font-weight:500;color:var(--text-heading)">{{ l.name }}</span><span style="display:block;font-size:12px;line-height:16px;color:var(--text-light)">{{ l.tag }}</span></span><span style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-light)">{{ l.kicker }}</span></a>
        </sc-for>
        <div style="border-top:1px solid var(--border-secondary);padding:8px 0"><button onClick="{{ goDiscoverClose }}" style="display:flex;justify-content:space-between;width:100%;padding:8px 16px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--link);cursor:pointer;white-space:nowrap">Discover your estate<span>→</span></button><button onClick="{{ goHomeClose }}" style="display:flex;justify-content:space-between;width:100%;padding:8px 16px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--link);cursor:pointer;white-space:nowrap">See the whole stack<span>→</span></button></div>
      </div>
    </sc-if>
  </div>
  <!-- Product pills, flat: the active one carries the light-blue fill. -->
  <nav aria-label="Products" style="display:flex;gap:4px;align-items:center;white-space:nowrap">
    <sc-for list="{{ pills }}" as="p" hint-placeholder-count="2">
      <button onClick="{{ p.go }}" aria-current="{{ p.current }}" aria-disabled="{{ p.dis }}" style="height:36px;padding:0 12px;border:0;border-radius:8px;background:{{ p.bg }};color:var(--link);opacity:{{ p.op }};font-size:14px;font-weight:500;cursor:{{ p.cursor }};white-space:nowrap" style-hover="background:{{ p.hover }}">{{ p.label }}</button>
    </sc-for>
  </nav>
  <div style="margin-left:auto;display:flex;align-items:center;gap:16px">
    <!-- Ask Andi: outlined pill with the Andi symbol (att_andi_sym). -->
    <button onClick="{{ toggleAndi }}" aria-label="Ask Andi" style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="border-color:var(--border-active)"><span aria-hidden="true" style="width:20px;height:20px;flex:none;background:url('{{ iconAndi }}') center / contain no-repeat"></span>Ask Andi</button>
    <!-- The bell: pending actions live in its name; a dot only while something is pending. -->
    <button onClick="{{ goFloor }}" aria-label="{{ bellLabel }}" style="position:relative;width:40px;height:40px;border:0;border-radius:9999px;background:transparent;cursor:pointer" style-hover="background:var(--bg-wash)"><span aria-hidden="true" style="display:block;width:22px;height:22px;margin:0 auto;background:url('{{ iconBell }}') center / contain no-repeat"></span><sc-if value="{{ hasTasks }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:9999px;background:var(--cta);box-shadow:0 0 0 2px var(--bg-base)"></span></sc-if></button>
    <!-- Avatar: the demo controls live behind it. -->
    <div style="position:relative">

</sc-if>
<sc-if value="{{ heroVisible }}" hint-placeholder-val="{{ true }}">

<div style="position:relative;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;padding:10px 24px 12px;display:flex;align-items:stretch;min-height:{{ heroMinH }}">

<div style="display:grid;gap:8px;width:100%;min-width:0">
<svg viewBox="0 0 1392 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Fabric picture" style="{{ heroSvgStyle }}">
  <defs>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e2a4d"></stop><stop offset="1" stop-color="#00235a"></stop></linearGradient>
  </defs>
  <foreignObject x="24" y="0" width="460" height="18"><button onClick="{{ sitesUp }}" title="Up one level" style="display:block;width:100%;border:0;background:transparent;padding:0;margin:0;text-align:left;color:{{ sitesHeadColor }};font-size:13px;line-height:18px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit">{{ sitesHead }}</button></foreignObject>
  <foreignObject x="980" y="0" width="240" height="18"><button onClick="{{ cloudsUp }}" title="Up one level" style="display:block;width:100%;border:0;background:transparent;padding:0;margin:0;text-align:left;color:{{ cloudsHeadColor }};font-size:13px;line-height:18px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit">{{ cloudsHead }}</button></foreignObject>
  <sc-if value="{{ showWorkloads }}" hint-placeholder-val="{{ true }}"><text x="1230" y="14" style="fill:var(--text-disabled);font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:500">Workloads</text></sc-if>

  <sc-for list="{{ heroEdges }}" as="e" hint-placeholder-count="6">
    <g opacity="{{ e.op }}" style="transition:opacity .2s">
      <path id="e-{{ e.id }}" d="{{ e.d }}" fill="none" stroke="{{ e.stroke }}" stroke-width="{{ e.w }}" stroke-dasharray="{{ e.dash }}" stroke-linecap="round"></path>
      <sc-if value="{{ e.amber }}" hint-placeholder-val="{{ false }}"><path d="{{ e.d }}" fill="none" stroke="var(--warning)" stroke-width="6" opacity=".25" style="animation:pulseOnce 1.6s ease-out infinite"></path><path d="{{ e.d }}" fill="none" stroke="transparent" stroke-width="14" onClick="{{ e.openObserve }}" role="button" aria-label="Degraded path: open Observe" style="cursor:pointer"></path></sc-if>
      <sc-if value="{{ e.sleeve }}" hint-placeholder-val="{{ false }}"><path d="{{ e.d }}" fill="none" stroke="var(--error)" stroke-width="{{ e.sleeveW }}" opacity=".22" stroke-linecap="round"></path></sc-if>
      <sc-if value="{{ e.crawl }}" hint-placeholder-val="{{ false }}"><path d="{{ e.d }}" fill="none" stroke="{{ e.stroke }}" stroke-width="1.5" stroke-dasharray="6 6" style="animation:crawl 2s linear infinite"></path></sc-if>
      <sc-if value="{{ e.violPulse }}" hint-placeholder-val="{{ false }}"><circle cx="{{ e.pinX }}" cy="{{ e.pinY }}" r="5" fill="var(--error)"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"></animate><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"></animate></circle></sc-if>
      <sc-if value="{{ e.gate }}" hint-placeholder-val="{{ false }}"><g transform="translate({{ e.gx }} {{ e.gy }})"><rect x="-7" y="-9" width="14" height="18" rx="3" fill="{{ e.gateFill }}" stroke="#0057b8" stroke-width="1.5"></rect><path d="M-3,-1 L-1,1.5 L3,-3" fill="none" stroke="{{ e.gateCheck }}" stroke-width="1.5" stroke-linecap="round"></path></g></sc-if>
      <sc-if value="{{ e.pin }}" hint-placeholder-val="{{ false }}"><g transform="translate({{ e.pinX }} {{ e.pinY }})"><circle r="8" fill="var(--warning)"></circle><text y="3.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">!</text></g></sc-if>
      <sc-if value="{{ e.hasLabel }}" hint-placeholder-val="{{ false }}"><foreignObject x="{{ e.lx }}" y="{{ e.ly }}" width="92" height="18" style="pointer-events:none"><div style="display:flex;justify-content:flex-end"><span style="font-size:10px;line-height:20px;font-weight:700;color:var(--text-heading);white-space:nowrap;padding:0 6px;border-radius:6px;background:var(--bg-base);opacity:.92">{{ e.label }}</span></div></foreignObject></sc-if>
      <sc-if value="{{ e.hasCompare }}" hint-placeholder-val="{{ false }}"><g transform="translate({{ e.cx }} {{ e.cy }})" style="animation:fadeIn .15s"><rect x="-8" y="-6" width="230" height="60" rx="8" style="fill:var(--bg-base);stroke:var(--border-secondary)"></rect><sc-for list="{{ e.compare }}" as="cp" hint-placeholder-count="3"><g transform="translate(0 {{ cp.y }})"><text x="0" y="9" font-size="9" font-weight="500" style="fill:var(--text-body)">{{ cp.short }}</text><rect x="74" y="2" width="{{ cp.w }}" height="8" rx="2" fill="{{ cp.fill }}"></rect><text x="200" y="9" font-size="9" font-weight="700" text-anchor="end" style="fill:var(--text-heading)">{{ cp.val }}</text></g></sc-for></g></sc-if>
      <sc-if value="{{ e.hasMath }}" hint-placeholder-val="{{ false }}"><foreignObject x="{{ e.cx }}" y="{{ e.cy }}" width="240" height="22" style="pointer-events:none"><div style="font-size:10px;line-height:20px;padding:0 8px;border-radius:6px;background:var(--bg-base);border:1px solid var(--border-secondary);color:var(--text-body);white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">{{ e.math }}</div></foreignObject></sc-if>
      <sc-if value="{{ e.pulse }}" hint-placeholder-val="{{ false }}"><path d="{{ e.d }}" fill="none" stroke="var(--warning)" stroke-width="3" style="animation:pulseOnce 1.2s ease-out 1 forwards"></path></sc-if>
      <sc-if value="{{ e.priv }}" hint-placeholder-val="{{ false }}">
        <circle r="2.5" fill="#3374cc" opacity=".45"><animateMotion dur="{{ e.durS }}" begin="{{ e.tailBegin }}" repeatCount="indefinite"><mpath href="#e-{{ e.id }}"></mpath></animateMotion></circle>
        <circle r="3.5" fill="#00abeb"><animateMotion dur="{{ e.durS }}" repeatCount="indefinite"><mpath href="#e-{{ e.id }}"></mpath></animateMotion></circle>
      </sc-if>
      <circle cx="{{ e.px }}" cy="{{ e.py }}" r="4" fill="{{ e.portFill }}" stroke="#0057b8" stroke-width="1.5"></circle>
      <sc-if value="{{ e.chip }}" hint-placeholder-val="{{ false }}">
        <rect x="{{ e.chipX }}" y="{{ e.chipY }}" width="{{ e.chipW }}" height="18" rx="9" style="fill:var(--bg-base);stroke:var(--border-secondary)"></rect>
        <foreignObject x="{{ e.chipX }}" y="{{ e.chipY }}" width="{{ e.chipW }}" height="18" style="pointer-events:none"><div style="font-size:13px;line-height:18px;font-weight:500;color:var(--link);text-align:center">{{ e.chip }}</div></foreignObject>
      </sc-if>
      <sc-if value="{{ e.shield }}" hint-placeholder-val="{{ false }}">
        <g transform="translate({{ e.sx }} {{ e.sy }})"><path d="M0,-7 L7,-4 L7,1 Q7,6 0,9 Q-7,6 -7,1 L-7,-4 Z" fill="#0057b8"></path><path d="M-3,0.5 L-1,2.5 L3,-2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"></path></g>
      </sc-if>
    </g>
  </sc-for>

  <sc-for list="{{ heroArcs }}" as="a" hint-placeholder-count="0">
    <path d="{{ a.d }}" fill="none" stroke="{{ a.stroke }}" stroke-width="1.5" stroke-dasharray="{{ a.dash }}"></path>
  </sc-for>

  <!-- band -->
