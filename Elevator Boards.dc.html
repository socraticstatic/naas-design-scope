<helmet>

<style>

@font-face { font-family: 'Aleck'; src: url('fonts/AleckSans-Md.ttf'); font-weight: 500; }
@font-face { font-family: 'Aleck'; src: url('fonts/AleckSans-Bd.ttf'); font-weight: 700; }
body { margin: 0; background: #e9edf1; font-family: 'Aleck', Helvetica, Arial, sans-serif; }
a { color: var(--link); } a:hover { color: var(--cta-hover); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</helmet>
<section style="{{ tokens }};padding:40px;display:grid;gap:40px;color:var(--text-heading)">
  <div style="display:grid;gap:6px;max-width:1440px">
    <div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--text-disabled)">Elevator brief · boards E0 to E7 · the demo walk · 1440</div>
    <h1 style="margin:0;font-size:26px;line-height:34px;font-weight:700">The name on the lockup is the layer you are standing on.</h1>
    <p style="margin:0;color:var(--text-body);font-size:14px">NetBond boards are drawn from the brief's wireframes at wireframe-plus fidelity; AI-grade boards reuse the storefront's parts. Toggle the theme in Tweaks.</p>
  </div>

  <!-- E0 -->
  <div style="display:grid;gap:12px">
    <div style="display:flex;gap:12px;align-items:baseline"><span style="font-size:12px;font-weight:700;color:var(--link);padding:2px 8px;border-radius:6px;background:var(--bg-accent)">E0</span><span style="font-size:14px;color:var(--text-body)">NetBond · Manage, Connections · lockup with chevron and subtitle. Nothing else moves.</span></div>
    <div data-screen-label="E0 NetBond Manage" style="width:1440px;min-height:760px;background:var(--bg-wash);border:1px solid var(--border-secondary);border-radius:12px;overflow:hidden">
      <header style="display:flex;align-items:center;height:64px;padding:0 24px;background:var(--bg-base);border-bottom:1px solid var(--border-secondary);gap:32px">
        <button style="display:grid;gap:0;padding:4px 8px;margin:0 -8px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit" aria-haspopup="menu" aria-expanded="false"><span style="display:flex;align-items:center;gap:6px;font-size:16px;line-height:20px;font-weight:700;letter-spacing:-.03em"><span style="color:#009fdb">AT&amp;T</span><span>NetBond® Advanced</span><span aria-hidden="true" style="font-size:12px;color:var(--text-light);font-weight:400">⌄</span></span><span style="font-size:11px;line-height:14px;color:var(--text-light)">Cloud on-ramp layer</span></button>
        <nav style="display:flex;gap:4px;height:64px;align-items:stretch;font-size:14px;font-weight:500"><span style="display:flex;align-items:center;padding:0 14px;color:var(--text-heading)">Create</span><span style="display:flex;align-items:center;padding:0 14px;color:var(--link);border-bottom:2px solid var(--cta);font-weight:700">Manage</span><span style="display:flex;align-items:center;padding:0 14px;color:var(--text-heading)">Monitor</span><span style="display:flex;align-items:center;padding:0 14px;color:var(--text-heading)">Configure</span></nav>
        <span style="margin-left:auto;display:flex;gap:16px;align-items:center;color:var(--text-body)"><span aria-hidden="true" style="width:20px;height:20px;background:url('{{ iconSearch }}') center / contain no-repeat"></span><span aria-hidden="true" style="width:20px;height:20px;background:url('{{ iconQuestion }}') center / contain no-repeat"></span><span aria-hidden="true" style="width:20px;height:20px;background:url('{{ iconBell }}') center / contain no-repeat"></span><span aria-hidden="true" style="width:20px;height:20px;background:url('{{ iconPerson }}') center / contain no-repeat"></span></span>

        </aside>
        <div style="padding:32px;display:grid;gap:20px;align-content:start">
          <div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div style="font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--text-disabled)">Viewing as Meridian Logistics</div><h2 style="margin:4px 0 0;font-size:26px;line-height:34px;font-weight:700">Connections</h2></div><button style="height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--cta);color:#fff;font-size:14px;font-weight:500">+ Create connection</button></div>
          <div style="background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;overflow:hidden">
            <div style="display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 1fr 120px;gap:16px;padding:12px 20px;border-bottom:1px solid var(--border-secondary);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--text-light)"><span>Connection</span><span>Provider · region</span><span>On-ramp</span><span>Bandwidth</span><span>Term</span><span>Status</span></div>
            <sc-for list="{{ conns }}" as="c" hint-placeholder-count="5">
              <div style="display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 1fr 120px;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border-secondary);font-size:14px;align-items:center"><span style="font-weight:700">{{ c.name }}</span><span style="color:var(--text-body)">{{ c.prov }}</span><span style="color:var(--text-body)">{{ c.ramp }}</span><span style="color:var(--text-body)">{{ c.bw }}</span><span style="color:var(--text-body)">{{ c.term }}</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-body)"><span style="width:8px;height:8px;border-radius:9999px;background:{{ c.dot }}"></span>{{ c.status }}</span></div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- E1 -->
  <div style="display:grid;gap:12px">
    <div style="display:flex;gap:12px;align-items:baseline"><span style="font-size:12px;font-weight:700;color:var(--link);padding:2px 8px;border-radius:6px;background:var(--bg-accent)">E1</span><span style="font-size:14px;color:var(--text-body)">NetBond · elevator open over E0 · check on Cloud.</span></div>
    <div data-screen-label="E1 Elevator open" style="width:1440px;min-height:520px;background:var(--bg-wash);border:1px solid var(--border-secondary);border-radius:12px;overflow:hidden;position:relative">
      <header style="display:flex;align-items:center;height:64px;padding:0 24px;background:var(--bg-base);border-bottom:1px solid var(--border-secondary);gap:32px">
        <button style="display:grid;gap:0;padding:4px 8px;margin:0 -8px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;outline:2px solid var(--border-active);outline-offset:2px;border-radius:8px" aria-haspopup="menu" aria-expanded="true"><span style="display:flex;align-items:center;gap:6px;font-size:16px;line-height:20px;font-weight:700;letter-spacing:-.03em"><span style="color:#009fdb">AT&amp;T</span><span>NetBond® Advanced</span><span aria-hidden="true" style="font-size:12px;color:var(--text-heading);font-weight:400;display:inline-block;transform:rotate(180deg)">⌄</span></span><span style="font-size:11px;line-height:14px;color:var(--text-light)">Cloud on-ramp layer</span></button>
        <nav style="display:flex;gap:4px;height:64px;align-items:stretch;font-size:14px;font-weight:500"><span style="display:flex;align-items:center;padding:0 14px">Create</span><span style="display:flex;align-items:center;padding:0 14px;color:var(--link);border-bottom:2px solid var(--cta);font-weight:700">Manage</span><span style="display:flex;align-items:center;padding:0 14px">Monitor</span><span style="display:flex;align-items:center;padding:0 14px">Configure</span></nav>
      </header>
      <div role="menu" aria-label="Switch network layer" style="position:absolute;top:72px;left:24px;width:320px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);overflow:hidden;animation:fadeIn .15s">
        <div style="padding:12px 16px;font-size:12px;line-height:18px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-light);border-bottom:1px solid var(--border-secondary)">AT&amp;T AI-grade network · layers</div>
        <sc-for list="{{ layersNB }}" as="l" hint-placeholder-count="4">
          <div role="menuitem" aria-current="{{ l.cur }}" style="display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;height:48px;padding:0 16px;background:{{ l.bg }};opacity:{{ l.op }};cursor:{{ l.cursor }}" style-hover="background:{{ l.hover }}"><sc-if value="{{ l.cur }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color:var(--link);font-weight:700;font-size:14px;text-align:center">✓</span></sc-if><sc-if value="{{ l.notCur }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width:18px;height:18px;background:url('{{ l.icon }}') center / contain no-repeat"></span></sc-if><span><span style="display:block;font-size:14px;line-height:18px;font-weight:500">{{ l.name }}</span><span style="display:block;font-size:12px;line-height:16px;color:var(--text-light)">{{ l.tag }}</span></span><span style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-light)">{{ l.kicker }}</span></div>
        </sc-for>
        <div style="border-top:1px solid var(--border-secondary);padding:8px 0"><div style="display:flex;justify-content:space-between;padding:8px 16px;font-size:14px;font-weight:500;color:var(--link)">Discover your estate<span>→</span></div><div style="display:flex;justify-content:space-between;padding:8px 16px;font-size:14px;font-weight:500;color:var(--link)">See the whole stack<span>→</span></div></div>
      </div>
      <div style="position:absolute;left:400px;top:120px;right:40px;font-size:13px;color:var(--text-light);display:grid;gap:6px;max-width:520px"><div>Menu: width 320, radius 16, 8px below the header, 150ms fade + 4px rise. Rows 48 high, 12/16 padding. Current row: cobalt 100 fill, check replaces the icon. Vision row dimmed to 40%, no hover, never links.</div><div>Icons: <code>cloud</code> is the brand's own. <code>apis</code>, <code>hub</code> and <code>cable</code> stand in for <code>ai</code>, <code>network</code> and <code>fiber</code>, which are not in the 26-icon brand set; cable is the nearest glyph to fiber.</div></div>
    </div>
  </div>

  <!-- E2 -->
  <div style="display:grid;gap:12px">
    <div style="display:flex;gap:12px;align-items:baseline"><span style="font-size:12px;font-weight:700;color:var(--link);padding:2px 8px;border-radius:6px;background:var(--bg-accent)">E2</span><span style="font-size:14px;color:var(--text-body)">AI-grade · Network services · Observe · lockup with subtitle; Flows &amp; paths rows name "NetBond · PE-IAD-02" as links.</span></div>
    <div data-screen-label="E2 Observe" style="width:1440px;background:var(--bg-wash);border:1px solid var(--border-secondary);border-radius:12px;overflow:hidden">
      <header style="display:flex;align-items:center;height:64px;padding:0 24px;background:var(--bg-base);border-bottom:1px solid var(--border-secondary);gap:32px">
        <button style="display:grid;gap:0;padding:4px 8px;margin:0 -8px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit" aria-haspopup="menu" aria-expanded="false"><span style="display:flex;align-items:center;gap:6px;font-size:16px;line-height:20px;font-weight:700;letter-spacing:-.03em"><span style="color:#009fdb">AT&amp;T</span><span>AI-grade network</span><span aria-hidden="true" style="font-size:12px;color:var(--text-light);font-weight:400">⌄</span></span><span style="font-size:11px;line-height:14px;color:var(--text-light)">Network services layer</span></button>
        <nav style="display:flex;gap:4px;height:64px;align-items:stretch;font-size:14px;font-weight:500"><span style="display:flex;align-items:center;padding:0 14px">Discover</span><span aria-hidden="true" style="width:1px;height:24px;background:var(--border-secondary);align-self:center"></span><span style="display:flex;align-items:center;padding:0 14px;color:var(--link);border-bottom:2px solid var(--cta);font-weight:700">Network services</span><span style="display:flex;align-items:center;padding:0 14px">AI Fabric</span></nav>
        <span style="margin-left:auto;display:flex;gap:16px;align-items:center;font-size:13px;font-weight:700;color:var(--link)"><span aria-hidden="true" style="width:20px;height:20px;background:url('{{ iconSearch }}') center / contain no-repeat"></span>✓3<span aria-hidden="true" style="width:20px;height:20px;background:url('{{ iconBell }}') center / contain no-repeat"></span><span aria-hidden="true" style="width:20px;height:20px;background:url('{{ iconPerson }}') center / contain no-repeat"></span></span>
      </header>
      <div style="display:grid;grid-template-columns:200px 1fr">
        <aside style="padding:16px 12px;border-right:1px solid var(--border-secondary);background:var(--bg-base);display:grid;gap:2px;align-content:start;font-size:13px">
          <div style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--text-light);padding:0 10px 8px">Network services</div>
          <sc-for list="{{ railObserve }}" as="r" hint-placeholder-count="5"><span style="height:36px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:10px;background:{{ r.bg }};color:{{ r.color }};font-weight:{{ r.weight }}"><span aria-hidden="true" style="width:18px;height:18px;background:url('{{ r.icon }}') center / contain no-repeat"></span>{{ r.label }}</span></sc-for>
        </aside>
        <div style="padding:32px;display:grid;gap:24px;align-content:start">
          <div style="display:grid;gap:4px"><h2 style="margin:0;font-size:18px;line-height:26px;font-weight:700">13% of your traffic rides the AT&amp;T-controlled path, saving $3.3k/mo. 87% still crosses the public internet.</h2><p style="margin:0;font-size:14px;color:var(--text-body)"><strong>For FinOps &amp; SRE:</strong> know where the traffic, the cost and the bottlenecks are, and what to do about them.</p></div>
          <div style="display:flex;align-items:center;gap:10px"><h3 style="margin:0;font-size:26px;line-height:34px;font-weight:700">Network Observability</h3><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--success);font-weight:500"><span style="width:8px;height:8px;border-radius:9999px;background:var(--success)"></span>Live</span></div>
          <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px">
            <sc-for list="{{ obTiles }}" as="k" hint-placeholder-count="6"><div style="padding:16px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px"><div style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;color:var(--text-disabled)">{{ k.l }}</div><div style="display:flex;align-items:baseline;gap:4px;margin-top:6px"><span style="font-size:30px;line-height:36px;font-weight:700">{{ k.v }}</span><span style="font-size:13px;color:var(--text-body)">{{ k.u }}</span></div></div></sc-for>
          </div>
          <div style="background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;padding:20px 24px;display:grid;gap:12px">
            <div style="font-size:14px;color:var(--text-body)"><strong>120.2 of 134.8 Gbps</strong> still rides the public internet · <strong style="color:var(--link)">14.6 Gbps</strong> under AT&amp;T control</div>
            <svg viewBox="0 0 900 220" width="100%" role="img" aria-label="Traffic Sankey" style="display:block">
              <path d="M12,10 C220,10 220,20 440,20 L440,150 C220,150 220,120 12,120 Z" fill="{{ pubFill }}" opacity=".35"></path>
              <path d="M12,124 C220,124 220,160 440,160 L440,206 C220,206 220,210 12,210 Z" fill="#3374cc" opacity=".55"></path>
              <path d="M452,20 C660,20 660,10 888,10 L888,140 C660,140 660,150 452,150 Z" fill="{{ pubFill }}" opacity=".35"></path>
              <path d="M452,160 C660,160 660,150 888,150 L888,206 C660,206 660,206 452,206 Z" fill="#3374cc" opacity=".55"></path>
              <rect x="0" y="10" width="12" height="110" rx="1" fill="{{ nodeFill }}"></rect><rect x="0" y="124" width="12" height="86" rx="1" fill="{{ nodeFill }}"></rect>
              <rect x="440" y="20" width="12" height="130" rx="1" fill="{{ pubFill }}"></rect><rect x="440" y="160" width="12" height="46" rx="1" fill="#0057b8"></rect>
              <rect x="888" y="10" width="12" height="130" rx="1" fill="{{ nodeFill }}"></rect><rect x="888" y="150" width="12" height="56" rx="1" fill="{{ nodeFill }}"></rect>
              <text x="20" y="66" style="fill:var(--text-heading);font-size:11px;font-weight:500">5 offices · rd-helion · untagged</text><text x="20" y="170" style="fill:var(--text-heading);font-size:11px;font-weight:500">classified-helion · finance-invoices</text>
              <text x="460" y="88" style="fill:var(--text-heading);font-size:11px;font-weight:500">Public internet</text><text x="460" y="186" style="fill:var(--link);font-size:11px;font-weight:700;text-decoration:underline">AT&amp;T fabric · NetBond · PE-IAD-02</text>
              <text x="880" y="76" text-anchor="end" style="fill:var(--text-heading);font-size:11px;font-weight:500">AI endpoints · object storage · internet</text><text x="880" y="182" text-anchor="end" style="fill:var(--text-heading);font-size:11px;font-weight:500">AI endpoints · SaaS</text>
            </svg>
          </div>
          <div style="background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;overflow:hidden">
            <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-secondary)"><span style="font-size:16px;font-weight:700">Flows &amp; paths</span><span style="font-size:12px;color:var(--text-light)">13% under AT&amp;T control · North-south 16% · East-west 0% · 0 steered</span></div>
            <sc-for list="{{ flowRows }}" as="f" hint-placeholder-count="4">
              <div style="display:grid;grid-template-columns:minmax(0,2.4fr) 1fr .6fr 1.2fr 1fr .6fr 90px;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border-secondary);font-size:13px;align-items:center"><span><span style="display:block;font-weight:700">{{ f.name }}</span><span style="display:block;font-size:11px;color:var(--text-light)">{{ f.pathPre }}<sc-if value="{{ f.hasLink }}" hint-placeholder-val="{{ false }}"><a href="#e9" style="color:var(--link);font-weight:500;text-decoration:none">{{ f.pathLink }}</a></sc-if></span></span><span style="color:var(--text-body)">{{ f.kind }}</span><span>{{ f.gbps }}</span><span style="color:var(--text-body)">{{ f.lat }}</span><span><span style="height:22px;padding:0 10px;border-radius:9999px;background:{{ f.ctlBg }};color:{{ f.ctlColor }};font-size:11px;line-height:22px;font-weight:500">{{ f.ctl }}</span></span><span style="color:var(--text-body)">{{ f.div }}</span><span style="text-align:right"><span style="height:28px;padding:0 14px;border-radius:9999px;border:1px solid {{ f.btnBorder }};background:{{ f.btnBg }};color:{{ f.btnColor }};font-size:12px;line-height:26px;font-weight:500;display:inline-block">{{ f.btn }}</span></span></div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- E3 -->
  <div style="display:grid;gap:12px">
    <div style="display:flex;gap:12px;align-items:baseline"><span style="font-size:12px;font-weight:700;color:var(--link);padding:2px 8px;border-radius:6px;background:var(--bg-accent)">E3</span><span style="font-size:14px;color:var(--text-body)">AI-grade · Network services · Connect · NetBond connections as on-ramp chips (links); one NetBond Adv chip planned (dashed, 60%); Cloud stratum link to NetBond. <strong>The picture here is a static stand-in:</strong> in the shell this is the storefront's live fabric hero (comets, strata, hover card, region drill, steer and simulate reactions) with the chips added to it.</span></div>
    <div data-screen-label="E3 Connect hero" style="width:1440px;background:var(--bg-wash);border:1px solid var(--border-secondary);border-radius:12px;overflow:hidden">
      <header style="display:flex;align-items:center;height:64px;padding:0 24px;background:var(--bg-base);border-bottom:1px solid var(--border-secondary);gap:32px">
        <button style="display:grid;gap:0;padding:4px 8px;margin:0 -8px;border:0;background:transparent;text-align:left;color:inherit;font:inherit"><span style="display:flex;align-items:center;gap:6px;font-size:16px;line-height:20px;font-weight:700;letter-spacing:-.03em"><span style="color:#009fdb">AT&amp;T</span><span>AI-grade network</span><span aria-hidden="true" style="font-size:12px;color:var(--text-light);font-weight:400">⌄</span></span><span style="font-size:11px;line-height:14px;color:var(--text-light)">Network services layer</span></button>
        <nav style="display:flex;gap:4px;height:64px;align-items:stretch;font-size:14px;font-weight:500"><span style="display:flex;align-items:center;padding:0 14px">Discover</span><span aria-hidden="true" style="width:1px;height:24px;background:var(--border-secondary);align-self:center"></span><span style="display:flex;align-items:center;padding:0 14px;color:var(--link);border-bottom:2px solid var(--cta);font-weight:700">Network services</span><span style="display:flex;align-items:center;padding:0 14px">AI Fabric</span></nav>
      </header>
      <div style="display:grid;grid-template-columns:200px 1fr">
